# Data for docs/reference/snaps.md, rendered with Jinja at build time (see conf.py).
#
# Families are shown as tabs in the order listed here.
# Within a family, list snaps newest first; they are shown in this order.
#
# To add a snap, add an entry at the top of its family, or add a new family.
# Text fields are MyST Markdown.
#
#   name:                  Display name of the model
#   anchor:                Link target, for example {ref}`gemma3`; keep it stable once published
#   snap:                  Snap name on the Snap Store
#   source:                URL of the snap's source repository
#   description:           Model description
#   hardware_intro:        Sentence shown above the hardware table
#   hardware:              Rows of the hardware optimizations table
#   explore_optimizations: Show the "list-engines/show-engine" note
#   wsl:                   Show the WSL 2 support note

families:
- name: Clef
  snaps:
  - name: Clef Flash
    anchor: clef-flash
    snap: clef-flash
    source: https://github.com/canonical/clef-flash-snap
    description: |-
      Clef Flash is an open-weights decision model. You describe the decision in plain words at request time, with your own labels, and it answers with a choice, a yes / no probability or a score.
      The input can be a combination of an image and text, with the output being decisions.
    hardware_intro: 'This inference snap is optimized for the following hardware:'
    hardware:
    - arch: amd64
      optimization: Generic CPU
      description: Optimized for several x86 CPU variants
    - arch: arm64
      optimization: Generic CPU
      description: Optimized for armv8 and armv9 CPUs
    - arch: amd64
      optimization: NVIDIA GPU
      description: CUDA-enabled GPU acceleration on x86 platforms
    - arch: arm64
      optimization: NVIDIA GPU
      description: CUDA-enabled GPU acceleration on arm64 platforms
    - arch: amd64
      optimization: AMD GPU
      description: ROCm-enabled GPU acceleration on x86 platforms
