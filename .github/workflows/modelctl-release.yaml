name: Release modelctl

on:
  release:
    types: [published]

defaults:
  run:
    working-directory: modelctl

jobs:
  build-and-release:
    permissions:
      contents: write # to upload release assets

    strategy:
      matrix:
        runner:
          - name: linux-amd64
            runs-on: ubuntu-24.04
            goos: linux
            goarch: amd64

          - name: linux-arm64
            runs-on: ubuntu-24.04-arm
            goos: linux
            goarch: arm64

    env:
      ARTIFACT_NAME: "modelctl-${{ matrix.runner.name }}.tar.xz"

    runs-on: ${{ matrix.runner.runs-on }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'

      - name: Install dependencies
        run: go mod download

      - name: Create bin directory
        run: mkdir -p bin

      - name: Build binary
        env:
          GOOS: ${{ matrix.runner.goos }}
          GOARCH: ${{ matrix.runner.goarch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: make build VERSION="${RELEASE_TAG}" BIN=./bin/modelctl

      - name: Generate artifact
        run: |
          cp ./completer/snap.bash ./bin/snap-completer.bash
          cp ./LICENSE ./bin/LICENSE

          # Create archive with LICENSE in root and bin/ subdirectory
          tar -Jcvf ${{ env.ARTIFACT_NAME }} \
            -C . LICENSE \
            -C . bin/modelctl \
            -C . bin/snap-completer.bash

      - name: Upload release asset
        run: |
          # --clobber overwrites existing assets of the same name
          gh release upload ${{ github.event.release.tag_name }} ${{ env.ARTIFACT_NAME }} --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Generate the CLI reference docs from a stable release and push them to a branch.
  # main only accepts reviewed PRs, so the person releasing opens the PR from the link in the run summary.
  update-cli-docs:
    if: ${{ !github.event.release.prerelease }}
    needs: [ build-and-release ]
    runs-on: ubuntu-26.04
    permissions:
      contents: write # to push the docs branch

    defaults:
      run:
        working-directory: .

    env:
      TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0 # for the release tags

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'

      - name: Push CLI docs branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Don't roll the docs back when patching an older release
          latest=$(git tag --list 'v*' | grep -v -- '-' | sort -V | tail -1)
          [ "$TAG" = "$latest" ] || { echo "Skipping: $TAG is not the latest stable release ($latest)"; exit 0; }

          git worktree add ../release "$TAG"
          make -C ../release/modelctl docs-cli VERSION="$TAG"
          file=docs/reuse/cli-commands.txt
          cp "../release/$file" "$file"
          git diff --quiet && { echo "CLI docs are already up to date"; exit 0; }

          # Commit through the API so the commit is authored (and signed) by github-actions[bot],
          # which the CLA check exempts. A git push would leave the commit unlinked to the bot.
          branch="docs/cli-reference-$TAG"
          main=$(git rev-parse HEAD)
          gh api "repos/$REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$main" >/dev/null \
            || gh api -X PATCH "repos/$REPO/git/refs/heads/$branch" -f sha="$main" -F force=true >/dev/null
          gh api -X PUT "repos/$REPO/contents/$file" -f branch="$branch" \
            -f message="docs: update CLI reference for $TAG" \
            -f sha="$(git rev-parse "HEAD:$file")" -f content="$(base64 -w0 "$file")" >/dev/null
          echo "[Open a PR](${{ github.server_url }}/${{ github.repository }}/compare/main...$branch?expand=1) to update the CLI docs for $TAG" >> "$GITHUB_STEP_SUMMARY"
