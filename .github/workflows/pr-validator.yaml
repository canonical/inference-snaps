# This workflow validates the PR title to ensure it follows semantic conventions
# based on https://www.conventionalcommits.org
#
# The PR title is used as the squash commit message when merging, and used to generate the changelog

name: PR Validator

on:
  pull_request:
    types:
      - opened
      - edited
      # - synchronize # Uncomment to trigger on every commit for required checks

jobs:
  semantic-title:
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
